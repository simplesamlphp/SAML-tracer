---

name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
